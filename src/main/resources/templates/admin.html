<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>CredSure Admin Dashboard</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
        }

        body{

            background:#edf2fb;

            padding:40px;
        }

        .container{

            max-width:1400px;

            margin:auto;

        }

        /* Header */

        .header{

            display:flex;

            justify-content:space-between;

            align-items:center;

            margin-bottom:35px;

        }

        .title h1{

            color:#1e3a8a;

            font-size:34px;

        }

        .title p{

            color:#6b7280;

            margin-top:8px;

        }

        .search-box input{

            width:300px;

            padding:12px 18px;

            border:none;

            border-radius:10px;

            outline:none;

            background:white;

            box-shadow:0 4px 12px rgba(0,0,0,.08);

            font-size:15px;

        }

        /* Statistics */

        .stats{

            display:grid;

            grid-template-columns:repeat(4,1fr);

            gap:20px;

            margin-bottom:35px;

        }

        .card{

            background:white;

            border-radius:18px;

            padding:24px;

            box-shadow:0 8px 18px rgba(0,0,0,.08);

            transition:.3s;

        }

        .card:hover{

            transform:translateY(-6px);

        }

        .card h2{

            color:#2563eb;

            font-size:15px;

            margin-bottom:12px;

            font-weight:600;

        }

        .number{

            font-size:34px;

            font-weight:bold;

            color:#111827;

        }

        .approved-card{

            border-left:6px solid #16a34a;

        }

        .review-card{

            border-left:6px solid #f59e0b;

        }

        .rejected-card{

            border-left:6px solid #dc2626;

        }

        .total-card{

            border-left:6px solid #2563eb;

        }

        /* Table */

        .table-card{

            background:white;

            padding:30px;

            border-radius:20px;

            box-shadow:0 8px 20px rgba(0,0,0,.08);

        }

        table{

            width:100%;

            border-collapse:collapse;

            margin-top:15px;

        }

        thead{

            background:#2563eb;

            color:white;

        }

        th{

            padding:16px;

            text-align:left;

        }

        td{

            padding:18px 16px;

            border-bottom:1px solid #e5e7eb;

        }

        tbody tr:hover{

            background:#f8fbff;

        }

        .status{

            padding:8px 14px;

            border-radius:25px;

            font-size:13px;

            color:white;

            font-weight:bold;

        }

        .approved{

            background:#16a34a;

        }

        .review{

            background:#f59e0b;

        }

        .rejected{

            background:#dc2626;

        }

        .risk-low{

            color:#16a34a;

            font-weight:bold;

        }

        .risk-medium{

            color:#f59e0b;

            font-weight:bold;

        }

        .risk-high{

            color:#dc2626;

            font-weight:bold;

        }

        @media(max-width:1000px){

            .stats{

                grid-template-columns:repeat(2,1fr);

            }

            .header{

                flex-direction:column;

                align-items:flex-start;

                gap:20px;

            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <div class="title">

            <h1>🏦 CredSure Admin Dashboard</h1>

            <p>Manage, Review & Monitor Loan Applications</p>

        </div>

        <div class="search-box">

            <input
                    type="text"
                    id="searchInput"
                    placeholder="🔍 Search Applicant">

        </div>

    </div>

    <div class="stats">

        <div class="card total-card">

            <h2>Total Applications</h2>

            <div class="number"
                 th:text="${applications.size()}">0</div>

        </div>

        <div class="card approved-card">

            <h2>Approved</h2>

            <div class="number"
                 th:text="${approvedCount}">0</div>

        </div>

        <div class="card review-card">

            <h2>Under Review</h2>

            <div class="number"
                 th:text="${reviewCount}">0</div>

        </div>

        <div class="card rejected-card">

            <h2>Rejected</h2>

            <div class="number"
                 th:text="${rejectedCount}">0</div>

        </div>

    </div>

    <div class="table-card">

        <table id="loanTable">

            <thead>

            <tr>

                <th>👤 Applicant</th>

                <th>🏦 Loan Type</th>

                <th>💰 Amount</th>

                <th>💼 Employment</th>

                <th>📊 Risk Score</th>

                <th>📌 Status</th>

            </tr>

            </thead>

            <tbody>

				<tr th:each="loan : ${applications}">

				    <td th:text="${loan.fullName}"></td>

				    <td th:text="${loan.loanType}"></td>

				    <td th:text="${'₹' + loan.loanAmount}"></td>

				    <td th:text="${loan.employmentType}"></td>

				    <!-- Risk Score -->

				    <td>

				        <span th:if="${loan.riskScore >= 80}"
				              class="risk-low"
				              th:text="${loan.riskScore} + ' (Low)'">
				        </span>

				        <span th:if="${loan.riskScore >= 50 && loan.riskScore < 80}"
				              class="risk-medium"
				              th:text="${loan.riskScore} + ' (Medium)'">
				        </span>

				        <span th:if="${loan.riskScore < 50}"
				              class="risk-high"
				              th:text="${loan.riskScore} + ' (High)'">
				        </span>

				    </td>

				    <!-- Status -->

				    <td>

				        <span th:if="${loan.status == 'APPROVED'}"
				              class="status approved">
				            ✔ Approved
				        </span>

				        <span th:if="${loan.status == 'UNDER REVIEW'}"
				              class="status review">
				            ⏳ Under Review
				        </span>

				        <span th:if="${loan.status == 'REJECTED'}"
				              class="status rejected">
				            ✖ Rejected
				        </span>

				    </td>

				</tr>

				</tbody>

				</table>

				</div>

				<div style="text-align:center;
				            margin-top:30px;
				            color:#6b7280;
				            font-size:14px;">

				    © 2026 CredSure Admin Dashboard | Loan Management System

				</div>

				</div>

				<script>

				const searchInput=document.getElementById("searchInput");

				searchInput.addEventListener("keyup",function(){

				    const filter=this.value.toLowerCase();

				    const rows=document.querySelectorAll("#loanTable tbody tr");

				    rows.forEach(row=>{

				        const text=row.innerText.toLowerCase();

				        row.style.display=text.includes(filter)?"":"none";

				    });

				});

				</script>

				</body>

				</html>
